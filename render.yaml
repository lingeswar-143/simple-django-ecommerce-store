services:
  - type: web
    name: simple-django-ecommerce-store
    env: python

    buildCommand: "./build.sh"

    startCommand: "gunicorn ecommerce.wsgi:application"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: False

      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString

databases:
  - name: ecommerce-db